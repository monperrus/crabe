[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crabe"
version = "6"
description = "Self-updating fleet agent reporting signed machine ids"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Martin Monperrus" }]
dependencies = ["paramiko"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[tool.hatch.build.targets.wheel]
only-include = ["crabe.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
